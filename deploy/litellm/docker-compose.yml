# Optional LiteLLM proxy for local development.
#
# Usage:
#   cp .env.example .env   # then fill in your provider keys
#   docker compose up -d
#   curl http://localhost:4000/health/liveliness
#
# The agi CLI has no dependency on this service.

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: agi-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
