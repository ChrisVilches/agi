# Optional LiteLLM gateway for local development.
#
# Usage:
#   cp .env.example .env   # then fill in your provider keys
#   docker compose up -d
#   curl http://localhost:4000/health/liveliness
#
# The Go client for this gateway is the litellm package alongside this file.
# Using a gateway is opt-in; agi runs without one.

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: agi-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://localhost:4000/health/liveliness", timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
